# BigLaw 2: Postgres 16 with pgvector + biglaw. All state lives in the pgdata volume.
# Values come from the shell or from .env (copy .env.example).
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16 # Postgres 16 with the vector extension (hybrid search)
    environment:
      POSTGRES_USER: biglaw
      POSTGRES_DB: biglaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (e.g. openssl rand -hex 24)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biglaw -d biglaw"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # No ports: Postgres is reachable only from the biglaw container.

  biglaw:
    # The published image (CI pushes it from main); `docker compose up -d --build` builds this
    # checkout instead. setup.sh pulls the image and never builds.
    build: .
    image: ghcr.io/discover-legal/biglaw:latest
    # Without sign-in, serve refuses a non-loopback address without
    # --allow-no-auth. That is safe here only because the port below is
    # published on the host's loopback; do not change it to 0.0.0.0 or a LAN IP
    # (README § Exposure). Under --allow-no-auth, Manage is read-only; to edit there,
    # add "--admin-without-auth" to this command, which lets anyone who can reach the
    # port change what every task's agents use.
    #
    # Sign-in (README § Sign-in): set these in .env and every request needs a
    # session; --allow-no-auth then has no effect (serve says so) and admins are
    # BIGLAW_ADMINS, with secrets and custom tools on for them. For example, with
    # a generic OIDC issuer and a TLS reverse proxy on the host that forwards
    # https://biglaw.example.com to 127.0.0.1:3101 keeping the Host header:
    #   BIGLAW_PUBLIC_URL=https://biglaw.example.com
    #   BIGLAW_OIDC_ISSUER=https://idp.example.com/realms/biglaw
    #   BIGLAW_OIDC_CLIENT_ID=biglaw
    #   BIGLAW_OIDC_CLIENT_SECRET=<the client's secret>
    #   BIGLAW_ADMINS=ada@example.com
    # Do not add --admin-without-auth with sign-in: serve refuses it.
    command: ["serve", "--allow-no-auth"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The password travels in PGPASSWORD (read by lib/pq), not in the URL,
      # so any character in POSTGRES_PASSWORD works without percent-encoding.
      BIGLAW_DATABASE_URL: postgres://biglaw@postgres:5432/biglaw?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BIGLAW_ADDR: 0.0.0.0:3101
      BIGLAW_PUBLIC_URL: ${BIGLAW_PUBLIC_URL:-}
      BIGLAW_MODEL_URL: ${BIGLAW_MODEL_URL:-}
      BIGLAW_MODEL_KEY: ${BIGLAW_MODEL_KEY:-}
      BIGLAW_MODELS: ${BIGLAW_MODELS:-}
      BIGLAW_BUDGET_CALLS: ${BIGLAW_BUDGET_CALLS:-}
      BIGLAW_BUDGET_USD: ${BIGLAW_BUDGET_USD:-}
      BIGLAW_LOCAL_WATTS: ${BIGLAW_LOCAL_WATTS:-}
      BIGLAW_PRICES: ${BIGLAW_PRICES:-}
      BIGLAW_COLLAPSE_THRESHOLD: ${BIGLAW_COLLAPSE_THRESHOLD:-}
      BIGLAW_COLLAPSE_ACTION: ${BIGLAW_COLLAPSE_ACTION:-}
      BIGLAW_OIDC_ISSUER: ${BIGLAW_OIDC_ISSUER:-}
      BIGLAW_OIDC_CLIENT_ID: ${BIGLAW_OIDC_CLIENT_ID:-}
      BIGLAW_OIDC_CLIENT_SECRET: ${BIGLAW_OIDC_CLIENT_SECRET:-}
      BIGLAW_ADMINS: ${BIGLAW_ADMINS:-}
      ALLOW_ANTHROPIC: ${ALLOW_ANTHROPIC:-}
      ALLOW_AWS: ${ALLOW_AWS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama on this computer: BIGLAW_MODEL_URL=http://host.docker.internal:11434/v1
    ports:
      - "127.0.0.1:3101:3101"   # loopback only on the host: the --allow-no-auth precondition (with sign-in, a TLS proxy on the host fronts it)
    restart: unless-stopped

volumes:
  pgdata:
