name: CI

# Adapted from v1's .github/workflows/ci.yml (fix/ci-and-citation-parse):
# the Go module is now the repo root, Postgres (with pgvector) runs as a service
# container, and BIGLAW_REQUIRE_DB=1 turns any skipped database test into a failure.
# Four jobs run in parallel: go (make ci), lint (staticcheck + govulncheck),
# docker (image build + Compose smoke test) and ui (npm ci, build, test).
on:
  pull_request:
  push:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # README promises any supported Postgres >= 14 (13 reached end of life
        # in November 2025); 16 is what Compose and Render run. Hybrid search
        # needs the pgvector extension: pgvector's images, pinned by tag and
        # digest (README § Database).
        include:
          - postgres: "14"
            image: pgvector/pgvector:0.8.6-pg14@sha256:fb27b00a92028f4749bf18f3d31b18fc62510258326486fb8900653ab2701252
          - postgres: "16"
            image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      BIGLAW_TEST_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
      BIGLAW_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      # Same version as go.mod's toolchain line and the Dockerfile
      # (TestGoVersionPinnedEverywhere checks all three agree).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fmt-check, vet, go mod verify/tidy, build + static-check, go test -race (unit + DB),
      # scripts/loc.py and its tests, docker compose config -q.
      - name: make ci
        run: make ci

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: go.sum
      - name: staticcheck
        run: make lint
      - name: govulncheck
        run: make vuln

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # tsc strict + the live and recorded builds; node:test (transport seam, recorded engine,
      # badges, and the recorded bundle has no network code).
      - name: make ui
        run: make ui

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Reserved URL characters on purpose: Compose passes it as PGPASSWORD.
      POSTGRES_PASSWORD: "ci/p@ss?w#rd:%"
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker compose build biglaw
      - name: start the Compose stack
        run: docker compose up -d --wait postgres && docker compose up -d biglaw
      - name: /health answers on the host's loopback
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3101/health; then exit 0; fi
            sleep 1
          done
          docker compose logs biglaw
          exit 1
      # --user: a uid with no passwd entry (k8s runAsUser) must still accept a DSN naming its user.
      - name: the image alone refuses to serve without auth on 0.0.0.0
        run: |
          set +e
          docker run --rm --user 54321:54321 -e BIGLAW_DATABASE_URL=postgres://u@db/x biglaw:local 2>err.txt; code=$?
          cat err.txt
          test "$code" = 2 && grep -q -- '--allow-no-auth' err.txt
      - name: logs
        if: always()
        run: docker compose logs; docker compose down -v
