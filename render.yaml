# Render Blueprint: the Docker web service plus a Render Postgres.
# Set the model and OIDC variables in the dashboard (sync: false).
services:
  - type: web
    name: biglaw
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BIGLAW_DATABASE_URL
        fromDatabase:
          name: biglaw-db
          property: connectionString
      - key: BIGLAW_ADDR
        value: 0.0.0.0:3101
      - key: PORT          # tells Render which port the service listens on
        value: "3101"
      - key: BIGLAW_PUBLIC_URL
        sync: false
      - key: BIGLAW_MODEL_URL
        sync: false
      - key: BIGLAW_MODEL_KEY
        sync: false
      - key: BIGLAW_MODEL_LEAD
        sync: false
      - key: BIGLAW_OIDC_ISSUER
        sync: false
      - key: BIGLAW_OIDC_CLIENT_ID
        sync: false
      - key: BIGLAW_OIDC_CLIENT_SECRET
        sync: false

databases:
  - name: biglaw-db
    databaseName: biglaw
    user: biglaw
    postgresMajorVersion: "16"
    ipAllowList: []   # no external connections; the web service uses the internal URL
